name: Deploy reference site

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; a merge that lands mid-deploy waits rather
# than racing the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: v3
          enable-cache: true

      # Ubuntu's texlive-latex-extra apt package pulls ~1GB to get the
      # handful of packages the templates actually use. Bootstrapping a
      # minimal TeX Live via install-tl and adding exactly those packages
      # with tlmgr keeps the runner (and the cache) small; v3/templates/
      # latex/requirements.txt is the manifest `just lint-latex` keeps
      # honest, so this step never installs more than the templates need.
      - name: Cache TeX Live
        id: cache-texlive
        uses: actions/cache@v4
        with:
          path: /usr/local/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('v3/templates/latex/requirements.txt') }}

      - name: Install a minimal TeX Live
        if: steps.cache-texlive.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz
          cd install-tl-*
          cat > texlive.profile <<'PROFILE'
          selected_scheme scheme-infraonly
          TEXDIR /usr/local/texlive
          TEXMFLOCAL /usr/local/texlive/texmf-local
          TEXMFSYSVAR /usr/local/texlive/texmf-var
          TEXMFSYSCONFIG /usr/local/texlive/texmf-config
          PROFILE
          ./install-tl --profile=texlive.profile

      - name: Install the manifest's LaTeX packages
        run: |
          echo "/usr/local/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
          export PATH="/usr/local/texlive/bin/x86_64-linux:$PATH"
          tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
          packages=$(sed 's/#.*//' v3/templates/latex/requirements.txt)
          tlmgr install $packages

      - name: Build the site
        working-directory: v3
        run: just render-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v3/output

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
