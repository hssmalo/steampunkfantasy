explanation = """When placing Aim or Shaken on a unit for the first time, place two tokens of the given type. Otherwise, place only one.

No other token is placed this way. Confused in particular is an exception: it works differently, and this rule does not cover it.

Follow the instructions for each token.
"""

[tokens]

[tokens.shaken]
name = "Shaken"
phases = ["Gunnery 1", "Movement 1", "Movement 2", "Movement 3", "Gunnery 2"]
effect = "While shaken set unit speed to the specified speed, and how a unit behaves is described by each unit. Disregard the original orders and replace them with the order(s) described by the unit"
remove = "Remove one each aftermath phase. Can also be removed by appropriate repair or healing abilities"


[tokens.aim]
name = "Aim"
phases = ["Gunnery 1", "Gunnery 2"]
effect = "Get +2 to hit an enemy. Only valid for units in line of sight of the hex where the aim was given. Last for only 1 round."
remove = "Either remove all aim tokens when you fire, or remove one each aftermath phase. Also remove all of them if you enter an assault (regardless of whether you win or not)"

[tokens.crippled_crew]
name = "Crippled Crew"
phases = []
effect = "Get -1 to hit and -1 on all assault dice. In addition, if unit is also shaken, psychic damage now causes crew damage instead"
remove = "Only by healing ability"

[tokens.plus_minus_one]
name = "-1 to hit, +1 to be hit "
phases = []
effect = "Get -1 to hit and -1 on all assault dice, while enemy gets +1 to hit this unit with by range and assaults. Enemy also gets to add or subtract one to critical effects"
remove = "Only by repair ability: repair Critical."

[tokens.disabled_repair]
name = "Disabled Repair"
phases = ["Healing 1", "Healing 2"]
effect = "Repair ability disabled."
remove = "This is an critical effect which may be repaired by repair critical. (however obviously this ability cannot be repaired by this unit)"

[tokens.no_command]
name = "No command"
phases = []
effect = "Unit cannot use command abilities"
remove = "This is an critical effect which my be repair by repair critical."

[tokens.cannot_move]
name = "Cannot Move"
phases = ["Movement 1", "Movement 2", "Movement 3"]
effect = "Speed is set to still and unit cannot move. Treat all F as -"
remove = "This is an critical effect which my be repair by repair critical."

[tokens.cannot_accelerate]
name = "Cannot Accelerate"
phases = ["Movement 1", "Movement 2", "Movement 3"]
effect = "Unit can move, but cannot increase speed. This also includes starting flying. Treat all A as -"
remove = "This is an critical effect which my be repair by repair critical."

[tokens.cannot_turn]
name = "Cannot Move"
phases = ["Movement 1", "Movement 2", "Movement 3"]
effect = "Unit cannot turn. Treat all L/R and 360° as -"
remove = "This is an critical effect which my be repair by repair critical."

[tokens.minor_acid]
name = "Minor Acid"
phases = ["Agony 1"]
remove = "Only as part of effect"
effect = "Role a die, at 3+, unit gets +1 on future damage. Otherwise, remove minor acid"

[tokens.fire]
name = "Fire"
phases = ["Agony 2"]
remove = "Only as part of effect"
effect = '''Role a d6 and suptracked unit fire resistance if any. If this number is 1 or below, fire is removed. Otherwise_


- Ignore armor and regular damage resistance
- Apply bonus to damage based on the number +future damage tokens
- Apply damage to the regular damage table  (apply damage after you roll damage for all fire tokens)
'''

[tokens.acid]
name = "Acid"
phases = ["Agony 0"]
remove = "Downgraded as part of effect"
effect = """Roll a d8 on the following damage table:

1. Downgrade from acid to minor acid.
2. +1 to future damage
3. As 2, and if unit has armor, it is reduced by 1 (all directions)
4. As 3, and place a poison cloud [4] at hex, and all units in this hex gets a minor acid token.
5. As 4, and in addition all units within range=2 gets a minor acid token
6. As 5, and unit gains a terror token.
7. As 6 and unit is set on fire.
8. Roll three times on this table.,
"""

[tokens.terror]
name = "Terror"
phases = ["Agony 0"]
effect = "Acts as if unit has Terror[6] (range=2) but effects only units of the same team"

[tokens.poison]
name = "Poison"
short = "[N]"
phases = ["Agony 3"]
effect = """Roll a d{N}.

- Ignore armor and regular damage resistances
- Reduce damage by poison resistances of target
- Apply bonus to damage based on the number +future damage tokens
- Apply damage to the regular damage table.
- If poison killed a model, remove poison.

If poison did not kill a model, downgrade poison one step"""

[tokens.poison.variables]
N = { type = "int", values = [2, 4, 6, 8, 10, 12] }

[tokens.bleed]
name = "Bleed"
short = "[N]"
phases = ["Agony 4"]
effect = """Roll a d{N}. At 1, remove bleed token.

Otherwise:

- Ignore armor and regular damage resistances
- Apply bonus to damage based on the number +future damage tokens
- Apply damage to the regular damage table, with the exception that bleed does not cause more bleed.
- If bleed killed a model, remove bleed.
"""

[tokens.bleed.variables]
N = { type = "int", values = [2, 4, 6, 8, 10, 12] }

[tokens.confused]
name = "Confused"
phases = ["Gunnery 1", "Movement 1", "Movement 2", "Movement 3", "Gunnery 2"]
remove = "Remove one token each pre-assault step in each movement phase"
effect = "Only effects biological units or units with biological crew. While confused, any movement order is replaced by a random move. Roll a d6, on 1-2, rotate unit left, on 3-4 rotate unit right, on 5-6: -. In addition, while confused you get -1 to hit."

[tokens.insane]
name = "Insane"
phases = ["Movement 1", "Movement 2", "Movement 3"]
remove = "When unit is not longer shaken"
effect = "Can only be given to bio units which are already shaken. If also hypnotized, remove hyptnotized token and replace it with insane. Any flee order is treatet at chase, but targets friends or foe alike. If there are two or more equally valid hexes to move to with chase, the owner still decides where to go"


[tokens.hypnotized]
name = "Hypnotized"
phases = ["Movement 1", "Movement 2", "Movement 3"]
remove = "When unit is not longer shaken"
effect = "Can only be given to bio units which are already shaken, and not insane. Any flee order is treatet as do nothing, stand still. In addition, Reduce assault strength 50% rounded down. "

[tokens.hidden]
name = "Hidden"
phases = []
remove = "You stay hidden until you reveal yourself, in aftermath phase if an enemy is within point blank range, or an enemy special action reveals your location. Cloaking devices stay hidden even if in clear terrain, while all others sources of hidden abilities are revealed if they are in slow or fast in clear terrain within line of sight to an enemy. You only get reveal bonuses if you willingly reveal your self, not if you are forced to."
effect = """While hidden you cannot be fired upon or be assaulted, nor can you fire or assault. You are also immune to Fear and Terror,

While hidden replace the unit with a hidden token. If you have multiple hidden units you do not have to reveal which one is under which token (but you have to keep track your self). In the start of the game you do not have to show the enemy exactly what units you have hidden. (but you have to state how many victory points worth of units that are hidden),

Reveal order: Place your unit within 2 hexes of the hidden token and gain reveal bonuses. In addition to revealing your self as a movement order, you may reveal your self any time you share an hex with an enemy. If so, make an assault and gain the stated reveal bonuses

If you reveal your self you get reveal bonuses: +2 to hit of ranged weapons and plus 50 percent assault strength and deflection for the first assault you participate in this round."""
