# The namespace registry: every namespace a reference may point into, and
# where its records live (ADR 0024). A namespace is an abstract name, not a
# path into the file layout — that is what keeps every ref two segments long
# and a table rename out of the Race files.
#
# Declaration order is display-group order for the to-hit table. A namespace
# may declare `group` to render under another's heading. `name` heads the whole
# registry; the singular `label` qualifies one record of it, as `Fog (hex)`.

[namespaces]
special = { name = "Specials", label = "special", file = "special.toml", table = "special" }
speed = { name = "Speeds", label = "speed", file = "modifiers.toml", table = "speed" }
terrain = { name = "Terrain", label = "terrain", file = "terrain.toml", table = "terrain" }
hex = { name = "Hex Effects", label = "hex", file = "hexes.toml", table = "hexes", group = "terrain" }
distance = { name = "Distance", label = "distance", file = "modifiers.toml", table = "distance" }
angle = { name = "Angle", label = "angle", file = "modifiers.toml", table = "angle" }
size = { name = "Size", label = "size", file = "modifiers.toml", table = "size" }
ability = { name = "Abilities", label = "ability", file = "modifiers.toml", table = "ability" }
token = { name = "Tokens", label = "token", file = "tokens.toml", table = "tokens" }
damage_type = { name = "Damage Types", label = "damage type", file = "namespaces.toml", table = "damage_type" }
resistance_type = { name = "Resistance Types", label = "resistance type", file = "namespaces.toml", table = "resistance_type" }


# The damage-type registry: the categories of harm a Resistance or an Immunity
# is against. It lives here because it is small and has no file of its own.

[damage_type.regular]
name = "Regular"
effect = "Any unnamed damage is regular damage."

[damage_type.psychic]
name = "Psychic"
effect = "Roll damage versus psychic damage table of target. If target has no psychic damage table, the target is immune to psychic damage."


[damage_type.fire]
name = "Fire"
see_also = ["token.fire"]
effect = "The result of fire token is considered fire damage."

[damage_type.poison]
name = "Poison"
see_also = ["token.poison"]
effect = "The result of poison token is considered poison damage."

[damage_type.acid]
name = "Acid"
see_also = ["token.acid", "token.minor_acid"]
effect = "The result of (minor) acid token is considered acid damage."

[damage_type.crew]
name = "Crew"
see_also = ["token.crippled_crew"]
effect = "Ignore armor, roll damage versus crew damage table of target. If target has no crew damage table, the target is immune to crew damage."


[resistance_type.regular]
name = "Regular"
effect = "Any damage rolled on regular damage table of unspecified type is reduced by {N}. This does not include damage from any other types."

[resistance_type.psychic]
name = "Psychic"
effect = "Any damage explicitly named psychic damage is reduced by {N}"

[resistance_type.fire]
name = "Fire"
effect = "Any damage rolled by fire token is effect is reduced damage by {N}. It is also reduced with respect to stop burning by {N}"
see_also = ["token.fire"]

[resistance_type.poison]
name = "Poison"
effect = "Any damage rolled by poison token effect reduced by {N}"
see_also = ["token.poison"]

[resistance_type.acid]
name = "Acid"
effect = "Any die rolled by acid or minor acid token is reduced by {N}."
see_also = ["token.acid", "token.minor_acid"]
