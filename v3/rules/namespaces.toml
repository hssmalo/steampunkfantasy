# The namespace registry: every namespace a reference may point into, and
# where its records live (ADR 0024). A namespace is an abstract name, not a
# path into the file layout — that is what keeps every ref two segments long
# and a table rename out of the Race files.
#
# Declaration order is display-group order for the to-hit table. A namespace
# may declare `group` to render under another's heading.

[namespaces]
special = { name = "Specials", file = "special.toml", table = "special" }
speed = { name = "Speeds", file = "modifiers.toml", table = "speed" }
terrain = { name = "Terrain", file = "terrain.toml", table = "terrain" }
hex = { name = "Hex Effects", file = "hexes.toml", table = "hexes", group = "terrain" }
distance = { name = "Distance", file = "modifiers.toml", table = "distance" }
angle = { name = "Angle", file = "modifiers.toml", table = "angle" }
size = { name = "Size", file = "modifiers.toml", table = "size" }
ability = { name = "Abilities", file = "modifiers.toml", table = "ability" }
token = { name = "Tokens", file = "tokens.toml", table = "tokens" }
damage_type = { name = "Damage Types", file = "namespaces.toml", table = "damage_type" }

# The damage-type registry: the categories of harm a Resistance or an Immunity
# is against. It lives here because it is small and has no file of its own.

[damage_type.regular]
