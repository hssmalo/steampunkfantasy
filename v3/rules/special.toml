[special.heal]
name = "Heal"
slots = ["unit"]
signature = "[{N}, {unit}, {phase}]"
effect = """Healing only works on biological units and removing crippled crew for units with bio crew. You have{N}points to spend on the following actions:

- Degrade one poison token one step. (ie. d6 becomes d4 (d4 are removed)). Cost 1.
- Degrade one bleeding token one step. (ie d6 becomes d4 (d4 are removed)). Cost 1.
- Remove one +1 to future damage token. Cost 1.
- Neutralize one minor acid. Cost 1.
- Extinguish one fire. Cost 3.
- Neutralize one poison token: Cost 3.
- Remove one bleeding token: Cost 3.
- Degrade one acid to minor acid. Cost 4.
- Remove crippled crew token. Cost 4.
"""
see_also = ["token.poison", "token.bleed", "token.minor_acid", "token.acid", "token.fire", "token.crippled_crew"]
todo = "Some Race grants scale {N} with the number of alive models, which no scalar type can express: those instances carry the formula as text. The `formula` type now exists (ADR 0027); decide whether these instances should use it."

[special.heal.variables]
N = { type = ["int", "str"], min = 1, max = 10 }
unit = { type = "str", values = ["self", "any", "other"] }
phase = { type = "str", values = ["1st Healing", "2nd Healing"] }

[special.immunity]
name = "Immunity"
slots = ["unit"]
signature = "[{feature}]"
flavor = "Unit is completely immmune to given feature"
todo = """Rule text not yet written: what "completely immune" does to each kind of feature it can name.

An immunity holds at every value of its feature, but a feature whose own rule takes variables lends them to the instance, which then has to name one. Poison-cloud immunity therefore names a strength it does not mean, and immunity to Gear Disruption is carried as text because no value of its thresholds is the one meant.

From reference.toml:
#Til Geir Arne: hmmm. Values burde her være en av de egenskapene som ligger her inne... eller fritekst og satse på at Hss gjør ting riktig???"""

[special.immunity.variables]
feature = { type = "ref", namespaces = ["token", "hex", "special", "damage_type"] }

[special.immunity.variants]
immune_to_gear_disruption = "Also immune to Gear Disruption"


