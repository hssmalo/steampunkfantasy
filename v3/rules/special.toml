[special.resistance.versions.regular]
effect = "Any damage rolled on regular damage table of unspecified type is reduced by {N}. This does not include damage from any other type. "

[special.resistance.versions.psychic]
effect = "Any damage explicitly named psychic damage is reduced damage by {N}"

[special.resistance.versions.fire]
effect = "Any damage rolled by fire token is effect is reduced damage by {N}. It is also reduced with respect to stop burning by {N}"

[special.resistance.versions.poison]
effect = "Any damage rolled by poison token effect reduced damage by {N}"

[special.resistance.versions.acid]
effect = "Any die rolled by acid or minor acid token is reduced by {N}."

[special.heal]
name = "Heal"
slots = ["unit"]
signature = "[{N}, {unit}, {phase}]"
effect = """Healing only works on biological units and removing crippled crew for units with bio crew. You have{N}points to spend on the following actions:

- Degrade one poison token one step. (ie. d6 becomes d4 (d4 are removed)). Cost 1.
- Degrade one bleeding token one step. (ie d6 becomes d4 (d4 are removed)). Cost 1.
- Remove one +1 to future damage token. Cost 1.
- Neutralize one minor acid. Cost 1.
- Extinguish one fire. Cost 3.
- Neutralize one poison token: Cost 3.
- Remove one bleeding token: Cost 3.
- Degrade one acid to minor acid. Cost 4.
- Remove crippled crew token. Cost 4.
"""
see_also = ["token.poison", "token.bleed", "token.minor_acid", "token.acid", "token.fire", "token.crippled_crew"]

[special.heal.variables]
N = {type = "int", min = 1, max = 10}
unit = {type = "str", values=["self", "any"]}
phase  = {type = "str", values=["1st Healing", "2nd Healing"]}

[special.immunity]
name = "Immunity"
slots = ["unit"]
