todo = """Rule text not yet written. Distinct from Pre-Assault Retreat, or the same rule twice — decide which.

From reference.toml:
potential_references = ["special.unit.pre-assault_retreat"]"""
see_also = ["special.pre_assault_retreat"]

[special.retreat.variants]
