# The Special registry: one flat namespace keyed by identifier, each record
# declaring the slots it may be used in (ADR 0024). Where a Special applies is
# a field, not a section, because `Bonus`, `Extra Damage`, `Fog`, `LoS` and
# `Spawn` are one rule each used in several slots.

#
# Assault
#
[special.ork_reroll]
name = "Ork Reroll"
slots = ["assault"]
signature = "[{N}]"
effect = "Each natural 6 rolled in assault count as 2 hits. Further, any natural 6 rolled in assault lets you reroll {N} dice per wave of rerolls. Thus {N} may never be greater than the number of dice you have left. If any of the rerolled dice results in a natural 6, reroll again with a new wave of rerolls."

[special.ork_reroll.variables]
N = { type = "int" }

[special.cunning_assault]
name = "Cunning Assault"
slots = ["assault"]
signature = "[{N}]"
effect = "For each {N} assault successes assigned to one mechanical unit in assault, add +1 to all future damage tokens. If you manage to inflict two or more +1 to future damage this way, the enemy is shaken. Multiple hits from multiple models with same ability stack."
example = "If you hit the an enemy with a unit which have Cunning Assault[1 per 2] 4 times, you will add two +1 to future damage tokens and the enemy is shaken."
flavor = "This represent any cunning way to take out heavily armored units in assaults, where regular hits would do little damage."
places = ["token.shaken"]
see_also = ["special.cunning_assault_defense"]

[special.cunning_assault.variables]
N = { type = "int", min = 1, max = 4 }

[special.cunning_assault_defense]
name = "Cunning Assault Defense"
slots = ["assault"]
signature = "[{N}, {M}+]"
effect = "Roll {N} dice, for each die at {M}+, the unit gets one less +1 to future damage due to cunning assault. If the number +1 to future damage caused by cunning assault is reduced to 1 or less, the unit is not schaken. This effect stack with multiple models having the same ability"
see_also = ["special.cunning_assault", "special.cunning_deflection"]
todo = "Named close enough to \"Cunning Deflection\" that the two may be one ability under two names. The Race data has both; decide whether to merge them."

[special.cunning_assault_defense.variables]
N = { type = "int" }
M = { type = "int", min = 1, max = 6 }

[special.assault_gear_disruption]
name = "Assault Gear Disruption"
slots = ["assault"]
signature = "[{N}+][1 for {M}]"
effect = "Only applies when target is a drone. Roll a die per {M} hits. The drone gets one shaken token per roll of {N}+."
places = ["token.shaken"]
see_also = ["special.range_gear_disruption"]

[special.assault_gear_disruption.variables]
N = { type = "int", min = 1, max = 6 }
M = { type = "int", min = 1, max = 4 }

[special.pre_assault_retreat]
name = "Pre-Assault Retreat"
slots = ["unit"]
signature = "[{N}+]"
effect = "In pre-assault phase you may roll a die. At N+ you may retreat before the assaults starts. Treat this as a regular reatreat but give or take no assault damage. This ability may only be used if the hex retreating into neither becomes overcrowded, is an illegal hex or contain enemies."
see_also = ["special.retreat"]

[special.pre_assault_retreat.variables]
N = { type = "int", min = 2, max = 6 }

[special.pre_assault_retreat.variants]
while_superelite_alive = "As long as at least 1 superelite is alive"


[special.retreat]
