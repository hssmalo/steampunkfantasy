slots = ["unit"]
signature = "{version}[{N}]"
effect = "Gives improved resilience versus {version} damage"

###Note, may see if I need more.
###Note, modified acid rule to align with the others...
###Note: to do, change all units which have acid resistance to follow the the rule instead of old
[special.resistance.variables]
version = { type = "ref", namespaces = ["damage_type"] }
