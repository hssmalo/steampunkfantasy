From reference.toml:
#Til Geir Arne: hmmm. Values burde her være en av de egenskapene som ligger her inne... eller fritekst og satse på at Hss gjør ting riktig???"""

[special.immunity.variables]
feature = { type = "ref", namespaces = ["token", "hex", "special", "damage_type"] }

[special.repair]
name = "Repair"
slots = ["unit"]
signature = "[{N}, {unit}, {phase}]"
effect = """Repear only works on mechanical and drone units. You have {N} points to spend on the following actions:

- Remove one +1 to future damage token. Cost 1.
- Neutralize one minor acid. Cost 1
- Remove 1 shaken token to any unit which is not bio. Cost 1
- Extinguish one fire. Cost 3.
- Remove 1 crittical damage effect. Cost 3.
- Degrade one acid to minor acid. Cost 4.
"""
see_also = ["token.minor_acid", "token.acid", "token.fire", "token.shaken", "token.disabled_repair"]

[special.repair.variables]
N = { type = "int", min = 1, max = 10 }
unit = { type = "str", values = ["self", "any"] }
phase = { type = "str", values = ["1st Healing", "2nd Healing"] }

