# The Rulebook Index: what the Rulebook contains, in the order it contains it
# (ADR 0018). Each section names a Section Kind, which decides how its source
# is read and which template partial renders it.

title = "SteamPunkFantasy Rulebook"

[[sections]]
kind = "markdown"
source = "round.md"
title = "The Round"

# Hexes and Tokens come before Specials so that a Special's `token` reference
# points at something the reader has already met.
[[sections]]
kind = "hexes"
source = "hexes.toml"
title = "Hex Effects"

[[sections]]
kind = "tokens"
source = "tokens.toml"
title = "Tokens"

[[sections]]
kind = "specials"
source = "special.toml"
title = "Special Rules"
