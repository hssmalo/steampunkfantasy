[races]

[races.ogre]
name = "Ogre"
description = "Ogres are large intelligent humanoids typically about 4m in height. They enjoy fancy outfits and fancy equipment. Ogres are often joined by swarms of tiny drones."

[units]

[units.ogre_hydra]
race = "ogre"
name = "Ogre Hydra"
models = ["ogre_hydra", "ogre_hydra_crew", "ogre_hydra_crew"]
size = "huge"
cost.mp = 16
cost.xp = 96
description = '''Huge regenerating Hydra with 1 major head and 6 minor heads, with two ogres riding on the hydra. The hydra is the only animal large enough to carry two ogres as cavalry. Major head has an acid breath, minor heads spits poison, while the two Ogre riding on it has a Ogre rifle each. '''


lore = '''
Both the Elves and the Ogres uses these beasts in war, while DarkElf has made a mechanical copy.
'''

tip = '''Low range and slow is a bad combination, but if you manage to come within short range of enemy, the hydra has powerful firepower, and especially if you get an enemy within point blank range, where you can use the acid breath full potential. You may consider upgrading the Ogre Hydra Crew weapons to give it some better firepower at longer ranges.
'''

[units.ogre_hydra.shaken]
speed = "slow"
movement_order = ["-", "-", "flee"]

[[units.ogre_hydra.specials.regeneration]]
variant = "heal_per_head"

[[units.ogre_hydra.specials.heads]]
variant = "six_minor_heads"

[[units.ogre_hydra.specials.fire_order]]
text = "Breath weapon and poison spit always treated as loaded and used with Fire(H) orders. Crew weapons are used with Load(crew) and Fire(crew) orders"

[[units.ogre_hydra.specials.forward_position]]
args.N = 1

[units.ogre_hydra.orders.fire]
still = [["Fire(H)", "Load(crew)"], ["Load(crew)", "Fire(H)"], ["Fire(H)", "Fire(crew)"], ["Fire(crew)", "Fire(H)"]]
slow =  [["Fire(H)", "Load(crew)"], ["Load(crew)", "Fire(H)"], ["Fire(H)", "Fire(crew)"], ["Fire(crew)", "Fire(H)"]]

[units.ogre_hydra.orders.movement]
slow = [["360°", "F", "360°"], ["360°", "F", "B"]]
still = [["360°", "360°", "360°"], ["360°", "A ", "F"]]

[units.ogre_hydra.damage_tables.Regular]
rows = [
	"1-2: Bleed[4]",
	"3-5: +1 to future damage, Bleed[4]",
	"6-10: +1 to future damage, Bleed[6], destroy one minor head. If all minor heads are destroyed, add additional +3 to future damage instead. Amplify all bleeding one step. (4 to 6, 6 to 8, 8 to 10 and 10 to 12)",
	"10-17: As below, d6 Psychic damage",
	"18: Unit destroyed",
]
notes = [
	"Bleed does not cause more bleeding",
]

[units.ogre_hydra.damage_tables.Psychic]
rows = [
	"6+: shaken",
]

[units.ogre_infantry]
race = "ogre"
name = "Ogre Infantry"
description = '''
Ogre Infantry armed with a large ogre rifle. Ogre enjoy fancy outfits, even during war. The rifle is a ww1 style rifle.
'''

lore = '''
Most other nations envy the standard ogre infantry size, toughness, assault capabilities and firepower of their large weapons. While the ogres themselves realize that being big also have some disadvantages.
'''

tip = '''
The infantry comes in a smaller groups and has trouble taking cover. Even though you may give your infantry melee options to boost close combat capabilities, the most normal upgrades for the ogre infantry are fire support options: Fancy Rifle, Fancy Arquebus or Enhanced Fancy Ogre Rifle.

Versus regular infantry ogres are at a clear disadvantage since they only  fire two shots per unit. However versus thougher opponents, their far superior damage per shot compensate for lack of models in the unit.'''


models = ["ogre_infantry", "ogre_infantry"]
size = "large"
cost.mp = 16

[units.ogre_infantry.shaken]
speed = "slow"
movement_order = ["-", "-", "Flee"]

[[units.ogre_infantry.specials.to_hit]]
args.ability = "ability.take_cover"
args.speed = "speed.still"
args.N = -1

[units.ogre_infantry.orders.fire]
still = [
	["Fire", "-"],
	["-", "Fire"],
	["Load", "-"],
	["-", "Load"],
	["Aim", "-"],
	["-", "Aim"],
]

[units.ogre_infantry.orders.movement]
still = [["360°", "360°", "360°"], ["A+360°", "F", "360°"]]
slow = [["360°", "F", "360°"], ["360°", "B", "360°"]]

[units.ogre_infantry.damage_tables.Regular]
rows = [
	"2-3: Bleed[4]",
	"4-6: Kill 1 model",
	"7-10: Kill 1 model, Psychic damage[d6]",
	"11+: Unit destroyed",
]
notes = [
	"If one model is killed remove half of the +1 future damage tokens and if killed by bleeding/poison, remove that bleeding/poison token",
]

[units.ogre_infantry.damage_tables.Psychic]
rows = [
	"6+: shaken",
]

