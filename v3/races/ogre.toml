race = "ogre"
models = ["ogre_robot", "ogre_robot"]
name = "Ogre Robot"
description = '''A Robot (2m in height) armed with WW1 style rifle'''

lore = '''The ogres realize that being big comes with some big disadvantages, thus they compensate by making medium sized robots. Although being only medium size, they are still strong enough to fire large ogre rifles. Ogre Robots can also take some serious beating before they are taken out of action.
'''

tip = '''Due to being smaller and having some armor they are far better protected compared to Ogre infantry. However, the robots are not as good in close combat compared to the regular ogre infantry. They also cost cp (craftpoints) instead of mp (manpower) and thus may be viewed as more expensive'''

