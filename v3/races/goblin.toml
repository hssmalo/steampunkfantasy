[races]

[races.goblin]
name = "Goblin"
description = "Goblin are small humanoid creatures, about 1m in height. Sneaky infantry, viewed as somewhat primitive but has proven to have done some surprisingly well done engineering jobs"

[spawns.tiny_snake]
unit = "tiny_snake"

[units]

[units.goblin_infantry]
race = "goblin"
name = "Goblin Infantry"
models = [
	"goblin_infantry",
	"goblin_infantry",
	"goblin_infantry",
	"goblin_infantry"
]
size = "small"
cost.mp = 8
description = '''A Goblin armed with bow and grenades. Goblin are small in size, excellent in sneaking and avoiding danger.
'''

lore = '''
They are viewed as somewhat primitive by the standards of other races, and they are easily underestimated, until the Goblin infantry swarm you.
'''

tip = '''These are cheap and durable infantry which you may use to swarm the enemy. And especially with some upgrades and support, goblin infantry can be deadly. Consider if you want to combine these units with some motorized transport. In game terms you do want to come close and personal to the enemy, but avoid assaults. Luckily they are hard to hit and can evade incoming bombs.
'''


[units.goblin_infantry.shaken]
speed = "slow"
movement_order = ["-", "-", "Flee"]

#sneak: +1 to hit, 0 to be hit
[[units.goblin_infantry.specials.to_hit]]
args.ability = "ability.take_cover"
args.speed = "speed.sneak"
args.N = -2

[[units.goblin_infantry.specials.fire_order]]
text = "You may either fire a regular arrow, a special arrow (arrow with limited ammo) or use one thrown weapon with each fire order."

[[units.goblin_infantry.specials.evasion]]
args.N = 4

[units.goblin_infantry.orders.fire]
sneak = [["Fire", "Fire"]]

[units.goblin_infantry.orders.movement]
sneak = [["360°", "360°", "360°"], ["360°", "F", "360°"]]
slow  = [["360°", "F", "B"]]

[units.goblin_infantry.damage_tables.Regular]
rows = [
	"0-5: Kill 1 model",
	"6-7: Kill 1 model, Psychic damage[d6]",
	"8+: Unit destroyed",
]
notes = [
	"If one model is killed remove half of the +1 future damage tokens and if killed by bleeding/poison, remove that bleeding/poison token",
]

[units.goblin_infantry.damage_tables.Psychic]
rows = [
	"4+: shaken",
]




[units.giant_snake_cavalry]
race = "goblin"
name = "Giant Snake Cavalry"
models = ["giant_snake_cavalry"]
size = "large"
cost.mp = 4
cost.xp = 24


description = '''One giant scary snake with two goblin riding the. The goblin are wielding a bow each. In addition the battlefield is littered with tiny snakes, hiding in the grass below.
'''

lore = '''
A terrifying view for all enemies, which the goblin enjoys a lot since it is an unusual that any goblin in clear sight are scary.
'''

tip = '''
Decent endurance, decent in assault with an devastating poison if they hit, and not to expensive. However their low speed, combined with low range limits the usefulness. The large number of tiny snakes are the real power of this unit.
'''



[units.giant_snake_cavalry.shaken]
speed = "slow"
movement_order = ["-", "-", "Flee"]

[[units.giant_snake_cavalry.specials.fire_order]]
text = "You may fire two regular poison bow and use hallucinating poison spit once per fire order"

[[units.giant_snake_cavalry.specials.forward_position]]
args.N = 1

[[units.giant_snake_cavalry.specials.terror]]
args.N = 1
args.M = 6

[[units.giant_snake_cavalry.specials.hypnotizing_gaze]]
args.N = 1

[[units.giant_snake_cavalry.specials.spawn]]
text = "tiny_snake: At start of battle, place a hidden tiny snake in the same hex as the Snake Cavalry"

[units.giant_snake_cavalry.orders.fire]
still = [["Fire", "Fire"]]

[units.giant_snake_cavalry.orders.movement]
still = [["360°", "360°", "360°"], ["360°", "A", "F"]]
slow = [["360°", "F", "360°"], ["360°", "B", "-"], ["360°", "Chs", "-"]]

[units.giant_snake_cavalry.damage_tables.Regular]
rows = [
	"1-6: Bleed[8]",
	"7-8: +1 to future damage, Bleed[8]",
	"9+: Unit destroyed",
]
notes = [
	"Bleeding does not cause more bleeding",
]

[units.giant_snake_cavalry.damage_tables.Psychic]
rows = [
	"6+: shaken",
]



[units.tiny_snake]
race = "goblin"
name = "Tiny Snake"
models = ["tiny_snake", "tiny_snake"]
size = "tiny"

description = "Two tiny snakes hiding in the grass, ready to bite anyone that comes too close"

[units.tiny_snake.shaken]
speed = "slow"
movement_order = ["-", "-", "Flee"]

[[units.tiny_snake.specials.hidden]]
text = "Start with a hidden token"

[[units.tiny_snake.specials.terror]]
args.N = 1
args.M = 4

[units.tiny_snake.orders.movement]
