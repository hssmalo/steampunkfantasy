	"2+: shaken",
]




[units.goblin_infantry_carrier]
race = "goblin"
name = "Goblin Infantry Carrier"
models = ["goblin_infantry_carrier"]
size = "large"
armor = [10, 6, 5, 4]
cost.ip = 16

description = '''An Armored Carrier, armed with a light mortar, and deploying small goblin to the battlefield. The goblin swarm out of the vehicle in large numbers. It is very fast while driving straight forward.
'''


lore = '''Since Goblin infantry are smaller than the other races, you can pack more of them in the same vehicle. Once the goblin exit, they swarm the place with lots and lots of goblin infantry.
'''

tip = '''
Mostly used to deliver lots of goblin infantry fast to the front, however the light mortar can do some serious damage to both infantry and vehicles if you are lucky. Well armored from the front, less so from the sides and rear.
'''


[units.goblin_infantry_carrier.shaken]
speed = "still"
movement_order = ["-", "-", "-"]

[[units.goblin_infantry_carrier.specials.transport]]
text = "May transport up to 3 Goblin infantry. Deploy order is Deploy(range=1). May not be deployed into assault."

[[units.goblin_infantry_carrier.specials.forward_position]]
args.N = 1

[units.goblin_infantry_carrier.orders.movement]
slow = [
	["L/R", "(L/R)", "-"],
	["F", "L/R", "-"],
	["B", "-", "-"],
	["A+F", "F", "F+Deploy"],
	["F", "-", "-"],
	["B", "-", "-"],
]
fast = [["B", "-", "-"]]
still = [
	["L/R", "(L/R)", "(L/R)"],
	["-", "-", "-"],
	["(L/R)", "A", "F"],
	["rev", "-", "-"],
]

[units.goblin_infantry_carrier.orders.fire]
slow = [["-", "Load"], ["-", "Fire"]]
still = [["-", "Load"], ["-", "Fire"]]

[units.goblin_infantry_carrier.damage_tables.Regular]
rows = [
	"1-3: +1 to future damage",
	"4: As 1-3, shaken",
	"5-8: As 4, d6 critical damage",
	"9: Unit destroyed",
]

[units.goblin_infantry_carrier.damage_tables.Critical]
rows = [
	"1-2: 1d4 damage to all transported units",
	"3: Forced Deploy (all units, empty hexes only)",
	"4: Cannot rotate",
	"5: Unit cannot move",
	"6: Fire",
]

[units.goblin_infantry_carrier.damage_tables.Crew]
rows = [
	"4-5: Crippled Crew, if already shaken double initial Crew damage",
	"6-7: As 4-5, shaken",
	"8-11: As 6-7, +3 to future Crew damage",
	"12: Unit destroyed",
]

[units.bipedal_mech]
race = "goblin"
name = "Bipedal Mech"
models = ["bipedal_mech"]
size = "large"
armor = [8,8,8,6]
cost.ip = 24

description = '''Fairly well armored bipedal mechanized walker. On one side the bipedal mech has a big weapon (big mortar) which fires the dreaded stinkbomb at enemies, while on the left it is is armed with two light mortars.
'''

lore = '''These are the pride of goblin innovation, the first tank which walks on two legs. Or at least, that is what the goblin claim.
'''

tip = '''
Do not underestimate the stinkbombs, which are great versus infantry, tanks and vehicles. Versus biological units the stinkbombs poison the enemy, scare them, cover them in acid, and if you hit you get an area effect hopefully doing the same thing over again. Versus tanks with biological crew, the crew damage can be devastating too, especially versus tanks which are already shaken. It is useless versus drones and robots. Goblin do not know what aiming is, so fire load and repeat as often as possible.
'''

[units.bipedal_mech.shaken]
speed = "still"
movement_order = ["-", "-", "-"]

[[units.bipedal_mech.specials.fire_order]]
text = "Fire and load all weapons simultaneously. Fire stinkbomb in addition to two light mortars"

[[units.bipedal_mech.specials.forward_position]]
args.N = 2

[units.bipedal_mech.orders.movement]
still = [["360°", "360°", "360°"],["360°", "A", "360°"]]
slow  = [["360°", "F", "360°"], ["360°", "F", "B"]]



[units.bipedal_mech.orders.fire]

still = [["Load", "-"], ["Fire", "-"]]
slow =  [["Load", "-"], ["Fire", "-"]]

[units.bipedal_mech.damage_tables.Regular]
rows = [
	"1-3: +1 to future damage",
	"4: As 1-3, shaken",
	"5-8: As 4, d6 critical damage",
	"9: Unit destroyed",
]

[units.bipedal_mech.damage_tables.Critical]
rows = [
	"1: Take d12 Crew damage (note, it is not shaken before the apply damage step)",
	"2: Unit gets a minor acid token",
	"3: +1 to be hit, -1 to hit",
	"4: Cannot rotate",
	"5: Unit cannot move",
	"6: +1 to future damage and unit gets another shaken token",
]

[units.bipedal_mech.damage_tables.Crew]
