[units.mechanical_fire_bird]
race = "goblin"
name = "Mechanical Fire Bird"
models = ["mechanical_fire_bird"]
size = "medium"
armor = [5, 4, 4, 3]
cost.ip = 24
description = '''A robot modeled after the classical phoenix. Flies fast, trying to set all enemies around it on fire. Inside the robot is an remarkable reassemble mechanism which can rebuild the robot almost from scratch.
'''

lore = '''
How the goblin manage to make this marvel of a rebuild mechanism is a mystery.
'''

tip = '''Try to maneuver to have as many units/models as possible within range 2 and set them on fire with you ring of fire weapon. Sooner or later you will set an enemy on fire, which if the enemy have no means of remove it, is normally devastating. It is fairly well protected, both with fast flying which makes it har to hit, some armor protects from regular muskets and rifles, while simulatiously requires a few shots to disensamble. If you get to use your reassemble token, watch the frustration in your enemy. But do not imagine it is impossible to destroy.
'''

[units.mechanical_fire_bird.shaken]
speed = "fast_fly"
movement_order = ["-", "F", "F"]

[[units.mechanical_fire_bird.specials.phoenix]]
text = "Starts the game with one reassemble token. If temporarily destroyed in 2nd healing phase, you can use one reassemble token to become alive again. Set speed to fast_fly. If so, half (rounded down) all +1 to future damage token this unit has. If it does not have a reassemble token and is not temporarily destroyed at start of 2nd healing phase, gain one reassemble token. If, it is temporarily destroyed and has no reassemble tokens in 2nd healing phase, this unit is permanently destroyed. While temporarily destroyed, count the model as laying still with movement [-,-,-]"

[[units.mechanical_fire_bird.specials.immunity]]
args.feature = "damage_type.fire"

[units.mechanical_fire_bird.orders.movement]
fast_fly = [["L/R+F", "F", "F+L/R"], ["F", "F", "F"], ["F+L/R", "F+L/R", "F"]]

[units.mechanical_fire_bird.orders.fire]
fast = [["-", "Load"], ["-", "Fire"]]

[units.mechanical_fire_bird.damage_tables.Regular]
rows = [
	"1-3: +1 to future damage",
	"4-5: +2 to future damage",
	"6+: As 4-5, temporarily destroyed",
]
notes = [
	"While temporarily destroyed, all regular damage do inner damage instead",
	"+ to future damage does not apply to inner damage",
	"Note that it does not get the status temporarily destroyed before the apply damage step",
]

[units.mechanical_fire_bird.damage_tables.Inner]
rows = ["1-5: add one minor acid token", "6+: Remove reassemble token"]

