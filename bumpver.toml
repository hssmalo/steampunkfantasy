# Release configuration for `spf` (the project in `v3/`).
#
# This lives at the repository root, not beside `v3/pyproject.toml`, because
# bumpver looks for `.git` in the directory it is run from and only *warns*
# when it finds none — from `v3/` it would rewrite the version and then
# silently skip the commit, the tag, the push, and the pre-commit hook.
#
# The v-prefix lives only in the tag/current_version; `{pep440_version}` strips
# it so `[project].version` stays a bare PEP 440 string.
[bumpver]
current_version = "v2026.7.0"
version_pattern = "vYYYY.MM.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = "v3/.pre-commit-bumpver.sh"
commit = true
tag = true
push = true

[bumpver.file_patterns]
"bumpver.toml" = [
    'current_version = "{version}"',
]
"v3/pyproject.toml" = [
    'version = "{pep440_version}"',
]
